# One-time, read-only lockfile regeneration for portfolio PR #23.
# Remove this workflow after applying and validating its output.
name: One-time dependency remediation preview
on:
  push:
    branches:
      - feat/portfolio-stabilization-20261113
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'JMG3000/JMG3000.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild vetted dependency graph
        run: |
          npm pkg delete overrides.next.sharp
          npm install --save-exact next@16.4.6 js-yaml@5.5.0
          npm install --save-dev --save-exact eslint-config-next@16.4.6
          npm audit fix
      - name: Reinstall and validate
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Emit generated manifests for controlled GitHub API update
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['package.json', 'package-lock.json']) {
            const source = fs.readFileSync(name, 'utf8');
            for (let i = 0; i < source.length; i += 1200) {
              console.log('REPAIRFILE:' + name + ':' + String(i).padStart(8, '0') + ':' + JSON.stringify(source.slice(i, i + 1200)));
            }
          }
          console.log('REPAIRFILE:COMPLETE');
          NODE
